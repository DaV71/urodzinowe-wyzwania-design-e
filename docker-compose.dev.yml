# Lokalna baza do developmentu i testów integracyjnych: npm run db:up
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: urodzinowe
      POSTGRES_PASSWORD: urodzinowe
      POSTGRES_DB: urodzinowe
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - dbdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urodzinowe -d urodzinowe"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata_dev:
